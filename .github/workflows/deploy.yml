# Builds the site and ships it to Cloudflare Workers on every push to main.
#
# Add these two repository secrets before this can run
# (Settings, Secrets and variables, Actions):
#
#   CLOUDFLARE_API_TOKEN   Cloudflare, My Profile, API Tokens,
#                          "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the right of your Cloudflare dashboard home
#
# Until they exist this workflow fails at the last step, which is harmless.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: app
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: deploy
